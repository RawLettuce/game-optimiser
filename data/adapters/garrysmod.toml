# Garry's Mod adapter (app 4000). Sources and status tags: ADAPTERS-RESEARCH.md section 4.
# Settings are Source engine console variables written to garrysmod/cfg/autoexec.cfg, which the game runs at
# start [S]. The tool owns that file (it creates it when missing); unknown cvars are ignored by the engine.

[game]
id = "garrysmod"
name = "Garry's Mod"
appid = 4000
runtime = "proton"                 # [U] the library showed Proton; the native Linux build also exists
program = "gmod.exe"               # [U] x86-64 branch bin/win64/gmod.exe; the main branch runs hl2.exe
processes = ["gmod.exe", "hl2.exe", "hl2_linux", "gmod"]
headroom = 1.00                    # a timedemo replays the same frames each run

[files.settings]
path = "{install}/garrysmod/cfg/autoexec.cfg"
format = "srccfg"
create_if_missing = true
status = "S"

[launch_options]
remove_patterns = ["gamescope"]
ensure_prefix = "mangohud"
ensure_args = []
forbid = ["PROTON_USE_WINED3D", "LD_PRELOAD", "-high"]
advice = [
  "CPU bound game: gmod_mcore_test 1 (multicore rendering) is the usual fps fix in community guides, unstable for some [S]; the tool does not set it, try it by hand in the console",
  "Display: Options > Video, 3840x2160 borderless (or launch option -windowed -noborder)",
]

[[run_overrides]]
key = "fps_max"
value = "0"
status = "S"
why = "uncapped frame rate while measuring (a timedemo plays as fast as the cap allows) [S]"

[[settings]]
id = "antialiasing"
label = "Antialiasing Mode"
key = "mat_antialias"
levels = ["0", "2", "4", "8"]
labels = ["None", "2x MSAA", "4x MSAA", "8x MSAA"]
cost = [1.00, 1.06, 1.12, 1.22]     # MSAA shape borrowed from CS2's table; estimate
cpu = false
visual = 3
status = "S"

[[settings]]
id = "shadows"
label = "Shadow Detail"
key = "r_shadows"
levels = ["0", "1"]
labels = ["Low", "High"]
cost = [1.00, 1.05]                 # estimate
cpu = true
visual = 3
status = "S"

[[settings]]
id = "model_detail"
label = "Model Detail"
key = "r_rootlod"
levels = ["2", "1", "0"]
labels = ["Low", "Medium", "High"]
cost = [1.00, 1.03, 1.06]           # estimate
cpu = true
visual = 3
status = "S"

[[settings]]
id = "texture_detail"
label = "Texture Detail"
key = "mat_picmip"
levels = ["2", "1", "0", "-1"]
labels = ["Low", "Medium", "High", "Very High"]
cost = [1.00, 1.01, 1.02, 1.03]     # VRAM rather than fps; estimate
cpu = false
visual = 4
status = "S"

[[settings]]
id = "hdr"
label = "High Dynamic Range"
key = "mat_hdr_level"
levels = ["0", "1", "2"]
labels = ["None", "Bloom", "Full"]
cost = [1.00, 1.03, 1.06]           # estimate
cpu = false
visual = 2
status = "S"

[[settings]]
id = "filtering"
label = "Filtering Mode"
key = "mat_forceaniso"
levels = ["1", "2", "4", "8", "16"]
labels = ["Bilinear", "Anisotropic 2x", "Anisotropic 4x", "Anisotropic 8x", "Anisotropic 16x"]
cost = [1.00, 1.002, 1.004, 1.007, 1.01]
cpu = false
visual = 3
status = "S"

[benchmark]
scene = "timedemo gopt_bench"
duration_s = 60
confirm_duration_s = 60
instructions = """
Garry's Mod benchmark (timedemo, same frames every run):
 Once: start a single player game on gm_construct, open the console (~), type `record gopt_bench`, walk the
 same loop for about 60 s, type `stop`. Quit.
 Each run:
 1. Start the game from Steam with the launch option set as printed above.
 2. Console: `timedemo gopt_bench`, then press Shift+F2 to start the MangoHud log.
 3. When the demo ends the console prints the average fps (a cross check); quit the game fully.
"""
