# Warframe adapter (Proton, app 230410). Sources and status tags: ADAPTERS-RESEARCH.md table W1.
# status: P primary, S secondary, V verified on PC (dated), U unverified (confirmed by `gopt discover`).

[game]
id = "warframe"
name = "Warframe"
appid = 230410
runtime = "proton"
program = "Warframe.x64.exe"
processes = ["Warframe.x64.exe", "Launcher.exe"]
headroom = 1.25

[files.settings]
path = "{compatdata}/pfx/drive_c/users/steamuser/AppData/Local/Warframe/EE.cfg"
format = "eecfg"
status = "S"

[launch_options]
remove_patterns = ["gamescope"]
ensure_prefix = "mangohud"
ensure_args = []
forbid = ["PROTON_USE_WINED3D", "-high", "LD_PRELOAD", "--force-grab-cursor"]
# Printed with every plan. Target: native borderless on the AGON, no Gamescope (its --force-grab-cursor kept the
# cursor grabbed, seen on the PC 23 Oct 2026). Warframe opened on the LG that night: a KWin rule pins it to DP-2.
advice = [
  "Display Mode: Options > Display > Display Mode = Borderless Fullscreen, Resolution 3840x2160 (no Gamescope: the cursor is free to leave the game)",
  "KWin rule (once): System Settings > Window Management > Window Rules > Add New. Window class (application): Substring Match 'steam_app_230410' (check with Detect Window Properties while Warframe runs). Add Property > Screen: Force, pick the AGON (DP-2). Apply.",
  "If borderless still loses keyboard focus at 150% scaling: try Display Mode = Fullscreen next (DESIGN.md section 10, E1b), then the Wayland driver (E3)",
]

# Keys forced for the duration of a tuning session and restored afterwards (by undo of the session's backups).
[[run_overrides]]
key = "Graphics.AutoDetectGraphicsSettings"
value = "0"
status = "S"
why = "stops the game re-detecting and overwriting edited settings on launch"
restore = false

[[run_overrides]]
key = "Graphics.MaxFramerate"
value = "0"
status = "U"
why = "the fps cap must be off while measuring"
manual = "Options > Display > Max Framerate: set to the maximum (uncapped) for the tuning runs"

[[run_overrides]]
key = "Graphics.VSync"
value = "0"
status = "U"
why = "VSync must be off while measuring"
manual = "Options > Display > Vertical Sync: Off for the tuning runs"

[[settings]]
id = "upscaling"
label = "Upscaling"
key = "Graphics.Upscaling"
levels = ["DLSS_PERFORMANCE", "DLSS_BALANCED", "DLSS_QUALITY", "OFF"]
labels = ["DLSS Performance", "DLSS Balanced", "DLSS Quality", "Off (native)"]
cost = [1.00, 1.18, 1.42, 1.82]
cpu = false
visual = 3
upscaling = true
# Native first; DLSS Quality only when no native rung reaches the goal (Matthew, 23 Oct 2026).
# Proton 9+ enables DXVK-NVAPI by default and copies nvngx.dll into the prefix (ADAPTERS-RESEARCH.md 1.7).
fallback = "DLSS_QUALITY"
status = "U"

