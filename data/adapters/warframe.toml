[benchmark]
scene = "captura"
duration_s = 60
confirm_duration_s = 90
instructions = """
Warframe benchmark (same every run, about 60 s):
 1. Start the game from Steam with the launch option set as printed above.
 2. Arsenal > Appearance > Captura, open {scene} (the same scene every run). {scene_setup}
 3. Stay at the spawn point. Press Shift+F2 to start the MangoHud log.
 4. Do one slow full turn (about 15 s), then spawn 3 enemies and fire at them for 20 s.
 5. Stay still for the remaining time. The log stops by itself after 60 s.
 6. Quit the game fully (the tool refuses to edit files while it runs).
"""

# Offered on the first run; the choice is saved in warframe.learned.json and reused (`--scene` changes it).
# All three are open world landscape tiles (WFCD warframe-items, PhotoboothTile*Landscape / PlainsOfEidolon),
# the heaviest kind of scene: long draw distance, foliage, volumetrics. Time of day and rain only exist in open
# world scenes and must be the same every run [S 25]. Ownership is [U]: they are tradable scene items.
[[benchmark.scene_options]]
name = "Plains Of Eidolon Scene"
why = "open world (Cetus), dense foliage and water, long view distance"
setup = "Set Time of Day to noon (slider centred) and rain off, every run."

[[benchmark.scene_options]]
name = "Orb Vallis Scene"
why = "open world (Fortuna), snow, wide vistas and many lights"
setup = "Set Time of Day to noon (slider centred) and snow off, every run."

[[benchmark.scene_options]]
name = "Deimos Cambion Drift Scene"
why = "open world (Necralisk), organic geometry and heavy fog and volumetrics"
setup = "Set Time of Day to noon (slider centred), every run."
